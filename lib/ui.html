<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Claude Remote Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace; background: #272822; color: #F8F8F2; min-height: 100vh; min-height: 100dvh; padding: 0; overflow-x: hidden; }

  /* Top bar */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #1e1f1c; border-bottom: 1px solid #3e3d32; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; color: #A6E22E; }
  .topbar-btn { background: none; border: none; color: #75715E; font-size: 1.3rem; cursor: pointer; padding: 6px; width: auto; margin: 0; }
  .topbar-btn:active { color: #F8F8F2; }
  .topbar-btn svg { fill: #75715E; }
  .topbar-btn:active svg { fill: #F8F8F2; }

  /* Tab content area */
  .tab-content { padding: 68px 16px 88px; }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  /* Bottom tab bar */
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #1e1f1c; border-top: 1px solid #3e3d32; display: flex; align-items: stretch; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #75715E; font-size: 0.65rem; font-weight: 600; cursor: pointer; padding: 0; margin: 0; width: auto; transition: color 0.15s; }
  .tab svg { width: 24px; height: 24px; fill: currentColor; }
  .tab.active { color: #66D9EF; }
  .tab:active { color: #A6E22E; }

  /* Cards & entries */
  .card { background: #1e1f1c; border: 1px solid #3e3d32; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-header label { margin: 0; font-size: 0.85rem; color: #E6DB74; }
  .refresh-btn { background: none; border: none; color: #75715E; cursor: pointer; padding: 4px; width: auto; margin: 0; font-size: 1.1rem; transition: color 0.15s; }
  .refresh-btn:active { color: #66D9EF; }
  @keyframes spin-refresh { to { transform: rotate(360deg); } }
  .refresh-btn.loading { animation: spin-refresh 0.8s linear infinite; color: #66D9EF; }

  label { display: block; font-size: 0.85rem; color: #75715E; margin-bottom: 6px; }
  select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3e3d32; background: #272822; color: #F8F8F2; font-size: 1rem; font-family: inherit; margin-bottom: 12px; -webkit-appearance: none; }
  select:focus, input:focus { outline: none; border-color: #66D9EF; }
  button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #A6E22E; color: #272822; font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; margin-bottom: 12px; }
  button:active { background: #b6f23e; }
  button:disabled { opacity: 0.4; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #3e3d32; border-top-color: #66D9EF; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }

  /* Session & server entries */
  .entries { font-size: 0.85rem; }
  .entry { padding: 10px 0; border-bottom: 1px solid #3e3d32; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry:last-child { border-bottom: none; }
  .entry b { color: #FD971F; }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .entry-actions button { width: auto; padding: 6px 12px; font-size: 0.8rem; margin: 0; border-radius: 6px; }
  .entry.inactive { opacity: 0.4; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: #272822; }
  .tag.ready { background: #A6E22E; }
  .tag.connecting { background: #E6DB74; }
  .tag.stopped, .tag.error { background: #F92672; }
  .tag.running { background: #66D9EF; }
  .tag.stale { background: #FD971F; }

  /* Empty states */
  .empty-state { text-align: center; padding: 32px 16px; color: #75715E; }
  .empty-state svg { width: 48px; height: 48px; fill: #3e3d32; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  /* Settings sheet */
  .settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
  .settings-overlay.open { display: block; }
  .settings-sheet { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #1e1f1c; border-left: 1px solid #3e3d32; z-index: 201; padding: 20px; transition: right 0.25s ease; }
  .settings-overlay.open .settings-sheet { right: 0; }
  .settings-sheet h2 { font-size: 1.1rem; margin-bottom: 20px; color: #AE81FF; }
  .settings-item { padding: 14px 0; border-bottom: 1px solid #3e3d32; }
  .settings-item button { background: #F92672; color: #F8F8F2; }
  .settings-item button:active { background: #ff4088; }

  /* Token setup */
  #token-setup { text-align: center; padding: 80px 20px 20px; }
  #token-setup h1 { color: #A6E22E; }
  #token-setup label { color: #75715E; }
  #token-setup input { max-width: 400px; margin: 0 auto 12px; display: block; }
  #token-setup button { max-width: 400px; margin: 0 auto; display: block; }

  /* Links */
  a { color: #66D9EF; }
  a:active { color: #AE81FF; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');
let token = localStorage.getItem('launcher_token');
let refreshTimer = null;
let cachedProjects = null;
let currentTab = 'sessions';

function headers() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

function timeAgo(iso) {
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 10) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

// --- SVG Icons ---
const ICONS = {
  sessions: '<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>',
  launch: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>',
  servers: '<svg viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>',
  refresh: '\u21BB',
  empty_sessions: '<svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>',
  empty_servers: '<svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>',
};

// --- Tab navigation ---
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const page = document.getElementById('page-' + tab);
  const tabBtn = document.getElementById('tab-' + tab);
  if (page) page.classList.add('active');
  if (tabBtn) tabBtn.classList.add('active');
}

function toggleSettings() {
  const overlay = document.getElementById('settings-overlay');
  if (overlay) overlay.classList.toggle('open');
}

// --- Per-section refresh with loading indicator ---
async function refreshWithIndicator(btnId, refreshFn) {
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.add('loading');
  try { await refreshFn(); } catch {}
  if (btn) btn.classList.remove('loading');
}

// --- Session list ---
const ACTIVE_STATUSES = new Set(['ready','connecting','stale']);

function renderSessionList(sessions) {
  const container = document.getElementById('session-list');
  if (!container) return;

  if (!sessions || !sessions.length) {
    if (!container.innerHTML) {
      container.innerHTML = '<div class="empty-state">' + ICONS.empty_sessions + '<p>No sessions yet</p><p style="font-size:0.8rem;margin-top:4px;color:#3e3d32">Launch one from the New tab</p></div>';
    }
    return;
  }

  const sorted = [...sessions].sort((a, b) => {
    const aActive = ACTIVE_STATUSES.has(a.status) ? 0 : 1;
    const bActive = ACTIVE_STATUSES.has(b.status) ? 0 : 1;
    return aActive - bActive;
  });
  const activeCount = sorted.filter(s => ACTIVE_STATUSES.has(s.status)).length;

  container.innerHTML = '<div class="card entries">' +
    sorted.map(s => {
      const ago = s.lastActivityAt ? timeAgo(s.lastActivityAt) : '';
      const aliveIcon = s.alive ? '\u2022' : '\u25cb';
      const aliveColor = s.alive ? '#A6E22E' : '#F92672';
      const inactive = !ACTIVE_STATUSES.has(s.status) ? ' inactive' : '';
      const dirName = s.cwd ? s.cwd.replace(/\\/g, '/').split('/').pop() : s.prompt;
      const stopped = s.status === 'stopped' || s.status === 'error';
      const buttons = stopped
        ? `<button onclick="relaunchSession('${s.cwd}','${s.permMode || 'bypassPermissions'}')">Relaunch</button><button onclick="killSession('${s.id}')" style="background:#F92672;color:#F8F8F2">Kill</button>`
        : `<button onclick="killSession('${s.id}')" style="background:#F92672;color:#F8F8F2">Kill</button>`;
      const spinnerHtml = s.status === 'connecting' ? '<span class="spinner"></span>' : '';
      return `<div class="entry${inactive}">
        <div style="min-width:0;flex:1">${spinnerHtml}<b>${dirName}</b> <span class="tag ${s.status}">${s.status}</span> <span style="color:${aliveColor};font-size:0.9rem">${aliveIcon}</span><br><span style="color:#75715E;font-size:0.75rem">${s.permMode || '\u2014'}${ago ? ' \u00b7 ' + ago : ''} \u00b7 ${s.id}</span></div>
        <div class="entry-actions">${buttons}</div>
      </div>`;
    }).join('') + '</div>';
}

async function refreshSessions() {
  try {
    const { sessions } = await api('GET', '/sessions');
    renderSessionList(sessions);
  } catch {}
}

// --- Dev servers ---
const TYPE_COLORS = { expo: '#AE81FF', vite: '#66D9EF', next: '#F8F8F2', react: '#66D9EF', express: '#A6E22E', fastapi: '#A6E22E', tauri: '#E6DB74', unknown: '#75715E' };

function renderDevServers(servers) {
  const container = document.getElementById('dev-servers');
  if (!container) return;

  if (!servers || !servers.length) {
    if (!container.innerHTML) {
      container.innerHTML = '<div class="empty-state">' + ICONS.empty_servers + '<p>No dev servers detected</p><p style="font-size:0.8rem;margin-top:4px;color:#3e3d32">Start a dev server (ports 3000\u20139999)</p></div>';
    }
    return;
  }

  container.innerHTML = '<div class="card entries">' +
    servers.map(s => {
      const color = TYPE_COLORS[s.type] || TYPE_COLORS.unknown;
      const expoLink = s.expoUrl ? ' <a href="' + s.expoUrl + '" style="color:#AE81FF;font-size:0.8rem">Expo Go</a>' : '';
      return `<div class="entry">
        <div><span class="tag" style="background:${color};color:#272822">${s.name}</span> <b>:${s.port}</b>${expoLink}<br><a href="${s.url}" style="color:#66D9EF;font-size:0.75rem">${s.url}</a></div>
      </div>`;
    }).join('') + '</div>';
}

async function refreshDevServers() {
  try {
    const { servers } = await api('GET', '/dev-servers');
    renderDevServers(servers);
  } catch {}
}

// --- Auto-refresh (only refreshes the active tab's data) ---
function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(() => {
    if (currentTab === 'sessions') refreshSessions();
    else if (currentTab === 'servers') refreshDevServers();
  }, 5000);
}

function stopAutoRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

// --- Token setup ---
function renderTokenSetup() {
  stopAutoRefresh();
  app.innerHTML = `
    <div id="token-setup">
      <h1>Claude Remote Launcher</h1>
      <label>Enter your launcher token</label>
      <input id="tok" type="password" placeholder="Bearer token">
      <button onclick="saveToken()">Connect</button>
    </div>`;
}

function saveToken() {
  const t = document.getElementById('tok').value.trim();
  if (!t) return;
  token = t;
  localStorage.setItem('launcher_token', t);
  renderMain();
}

// --- Main app shell ---
async function renderMain() {
  stopAutoRefresh();
  app.innerHTML = '<div style="padding:80px 16px;text-align:center"><span class="spinner"></span> Loading...</div>';

  const [projData, sessData] = await Promise.all([
    cachedProjects ? Promise.resolve({ projects: cachedProjects }) : api('GET', '/projects'),
    api('GET', '/sessions'),
  ]);
  cachedProjects = projData.projects;
  const opts = cachedProjects.map(p => '<option value="' + p.path + '">' + p.name + '</option>').join('');

  app.innerHTML = `
    <div class="topbar">
      <h1>Launcher</h1>
      <button class="topbar-btn" onclick="toggleSettings()">${ICONS.settings}</button>
    </div>

    <div class="settings-overlay" id="settings-overlay" onclick="if(event.target===this)toggleSettings()">
      <div class="settings-sheet">
        <h2>Settings</h2>
        <div class="settings-item">
          <button onclick="stopAutoRefresh();localStorage.removeItem('launcher_token');location.reload()">Logout</button>
        </div>
      </div>
    </div>

    <div class="tab-content">
      <div id="page-sessions" class="tab-page active">
        <div class="section-header">
          <label>Sessions</label>
          <button id="refresh-sessions" class="refresh-btn" onclick="refreshWithIndicator('refresh-sessions',refreshSessions)">${ICONS.refresh}</button>
        </div>
        <div id="session-list"></div>
      </div>

      <div id="page-launch" class="tab-page">
        <div class="section-header">
          <label>New Remote Session</label>
        </div>
        <div class="card">
          <label>Project</label>
          <select id="project">${opts}</select>
          <label>Permission Mode</label>
          <select id="perm-mode">
            <option value="bypassPermissions">Bypass Permissions</option>
            <option value="acceptEdits">Accept Edits</option>
            <option value="dontAsk">Don't Ask</option>
            <option value="default">Default (ask each time)</option>
            <option value="plan">Plan Mode</option>
          </select>
          <button id="launch-btn" onclick="launch()">Launch Remote Control</button>
        </div>
      </div>

      <div id="page-servers" class="tab-page">
        <div class="section-header">
          <label>Dev Servers</label>
          <button id="refresh-servers" class="refresh-btn" onclick="refreshWithIndicator('refresh-servers',refreshDevServers)">${ICONS.refresh}</button>
        </div>
        <div id="dev-servers"></div>
      </div>
    </div>

    <div class="tabbar">
      <button id="tab-sessions" class="tab active" onclick="switchTab('sessions')">
        ${ICONS.sessions}
        <span>Sessions</span>
      </button>
      <button id="tab-launch" class="tab" onclick="switchTab('launch')">
        ${ICONS.launch}
        <span>New</span>
      </button>
      <button id="tab-servers" class="tab" onclick="switchTab('servers')">
        ${ICONS.servers}
        <span>Servers</span>
      </button>
    </div>`;

  renderSessionList(sessData.sessions);
  refreshDevServers();
  startAutoRefresh();
}

async function launch() {
  const btn = document.getElementById('launch-btn');
  const cwd = document.getElementById('project').value;
  const permissionMode = document.getElementById('perm-mode').value;
  btn.disabled = true;
  btn.textContent = 'Launching\u2026';

  try {
    await api('POST', '/remote-control', { cwd, permissionMode });
    switchTab('sessions');
    await refreshSessions();
  } catch (e) {
    console.error('[launcher] launch failed', e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Launch Remote Control';
  }
}

async function killSession(id) {
  await api('DELETE', '/session/' + id);
  await refreshSessions();
}

let _relaunchBusy = false;
async function relaunchSession(cwd, permissionMode) {
  if (_relaunchBusy) return;
  _relaunchBusy = true;
  document.querySelectorAll('.entry-actions button').forEach(b => {
    if (b.textContent === 'Relaunch') { b.disabled = true; b.textContent = 'Launching\u2026'; }
  });
  try {
    await api('POST', '/remote-control', { cwd, permissionMode });
    await refreshSessions();
  } catch (e) {
    console.error('[launcher] relaunch failed', e);
  } finally {
    _relaunchBusy = false;
  }
}

if (token) renderMain(); else renderTokenSetup();
</script>
</body>
</html>
